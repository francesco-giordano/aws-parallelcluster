Image:
  Os: alinux2023
HeadNode:
  InstanceType: t3.micro
  Networking:
    SubnetId: subnet-11111111
Scheduling:
  Scheduler: slurm
  SlurmQueues:
    - Name: queue1
      Networking:
        SubnetIds:
          - subnet-11111111
      ComputeResources:
        - Name: compute_resource1
          InstanceType: c5.2xlarge
    - Name: queue2
      Networking:
        SubnetIds:
          - subnet-22222222
      ComputeResources:
        - Name: compute_resource1
          InstanceType: c5.2xlarge
SharedStorage:
  - MountDir: /opt/shared/efs/managed/1
    Name: shared-efs-managed-1
    StorageType: Efs
